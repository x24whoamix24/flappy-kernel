# SPDX-License-Identifier: Apache-2.0
# Each install runs one arcade on one whole H100 SXM or NVL (132 SMs).

image:
  # The stock PyTorch image: at every start the pod downloads the arcade from
  # source.url and installs it (about a minute; Mirage comes prebuilt from the
  # release). To run an image built from the repository's Dockerfile instead,
  # set it here and set source.url to "".
  repository: pytorch/pytorch
  tag: 2.8.0-cuda12.8-cudnn9-devel
  pullPolicy: IfNotPresent

source:
  url: https://github.com/x24whoamix24/flappy-kernel/archive/refs/tags/v0.2.2.tar.gz

# Environment of deploy/serve.sh (docs/configuration.md lists every setting).
env:
  MODEL: Qwen/Qwen3-8B
  MAX_SEQ: "1024"
  LLM_WORKERS: "96"
  COTENANT_BLOCKS: "32"

# Extra arguments for the web server, e.g. when it is served under another
# origin or behind a reverse proxy:
#   [--allow-origin, https://arcade.example.com, --trust-proxy]
serverArgs: []

# Where the model (~16 GB) is kept. With neither set, an emptyDir: every
# restart downloads it again.
modelCache:
  existingClaim: ""  # a PersistentVolumeClaim
  hostPath: ""       # a directory on the node

service:
  type: ClusterIP    # LoadBalancer or NodePort to reach it without port-forward
  port: 80

resources:
  requests: {cpu: "16", memory: 64Gi, nvidia.com/gpu: "1"}
  limits: {memory: 96Gi, nvidia.com/gpu: "1"}

runtimeClassName: ""
nodeSelector: {}     # e.g. {nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3}
tolerations: []
