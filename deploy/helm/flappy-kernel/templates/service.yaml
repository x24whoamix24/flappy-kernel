apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels: {app.kubernetes.io/name: flappy-kernel, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  type: {{ .Values.service.type }}
  selector: {app.kubernetes.io/name: flappy-kernel, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports:
  - {name: http, port: {{ .Values.service.port }}, targetPort: http}
