# SPDX-License-Identifier: Apache-2.0
# One pod, one container: deploy/serve.sh runs the Mirage megakernel process and
# the web server side by side; they share memory through /dev/shm.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {app.kubernetes.io/name: flappy-kernel, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  # One arcade per GPU: game state lives in the GPU kernel, so a second replica
  # would be a separate arcade behind the same Service.
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: flappy-kernel, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: flappy-kernel, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      {{- with .Values.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: arcade
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- if .Values.source.url }}
        # Downloads the arcade's source, installs it and serves.
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          FK=/opt/flappy-kernel
          python - "$SOURCE_URL" "$FK" <<'PY'
          import io, sys, tarfile, urllib.request
          url, dest = sys.argv[1:]
          with tarfile.open(fileobj=io.BytesIO(urllib.request.urlopen(url).read())) as tar:
              members = []
              for m in tar.getmembers():
                  top, _, rest = m.name.partition("/")  # drop the archive's top directory
                  if rest:
                      m.name = rest
                      members.append(m)
              tar.extractall(dest, members=members, filter="data")
          PY
          "$FK/deploy/install.sh"
          exec "$FK/deploy/serve.sh" "$@"
        - start
        {{- else }}
        command: [/opt/flappy-kernel/deploy/serve.sh]
        {{- end }}
        {{- with .Values.serverArgs }}
        args:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
        {{- end }}
        ports:
        - {name: http, containerPort: 8080}
        env:
        - {name: HF_HOME, value: /root/.cache/huggingface}
        {{- if .Values.source.url }}
        - {name: SOURCE_URL, value: {{ .Values.source.url | quote }}}
        {{- end }}
        {{- range $name, $value := .Values.env }}
        - {name: {{ $name }}, value: {{ $value | quote }}}
        {{- end }}
        resources: {{- toYaml .Values.resources | nindent 10 }}
        # Healthy once frames come from the GPU: install, model download (first
        # start only) and megakernel compilation take up to ~30 minutes.
        startupProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 10
          failureThreshold: 180
        livenessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 15
          failureThreshold: 4
        readinessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 5
        volumeMounts:
        - {name: model-cache, mountPath: /root/.cache/huggingface}
        - {name: shm, mountPath: /dev/shm}
      volumes:
      - name: model-cache
        {{- if .Values.modelCache.existingClaim }}
        persistentVolumeClaim: {claimName: {{ .Values.modelCache.existingClaim }}}
        {{- else if .Values.modelCache.hostPath }}
        hostPath: {path: {{ .Values.modelCache.hostPath }}, type: DirectoryOrCreate}
        {{- else }}
        emptyDir: {}
        {{- end }}
      - name: shm
        emptyDir: {medium: Memory, sizeLimit: 16Gi}
