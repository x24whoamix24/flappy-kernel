# SPDX-License-Identifier: Apache-2.0
# One pod, one container: deploy/serve.sh runs the Mirage megakernel process and
# the web server side by side; they share memory through /dev/shm.
{{- if and (not .Values.source.enabled) (eq .Values.image.repository "pytorch/pytorch") }}
{{- fail "source.enabled=false needs an image built from the repository's Dockerfile (image.repository)" }}
{{- end }}
{{- $port := .Values.env.PORT | default "8080" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {app.kubernetes.io/name: flappy-kernel, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  # One arcade per GPU: game state lives in the GPU kernel, so a second replica
  # would be a separate arcade behind the same Service.
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: flappy-kernel, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: flappy-kernel, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      # The arcade does not use the Kubernetes API.
      automountServiceAccountToken: false
      {{- with .Values.runtimeClassName }}
      runtimeClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: arcade
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- if .Values.source.enabled }}
        # Downloads the arcade's source, installs it and serves.
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          FK=/opt/flappy-kernel
          python - "$SOURCE_URL" "$FK" <<'PY'
          import io, sys, tarfile, urllib.request
          url, dest = sys.argv[1:]
          with tarfile.open(fileobj=io.BytesIO(urllib.request.urlopen(url).read())) as tar:
              members = []
              for m in tar.getmembers():
                  top, _, rest = m.name.partition("/")  # drop the archive's top directory
                  if rest:
                      m.name = rest
                      members.append(m)
              tar.extractall(dest, members=members, filter="data")
          PY
          "$FK/deploy/install.sh"
          exec "$FK/deploy/serve.sh" "$@"
        - start
        {{- else }}
        command: [/opt/flappy-kernel/deploy/serve.sh]
        {{- end }}
        {{- with .Values.serverArgs }}
        args:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
        {{- end }}
        ports:
        - {name: http, containerPort: {{ $port }}}
        env:
        - {name: HF_HOME, value: /root/.cache/huggingface}
        {{- if .Values.source.enabled }}
        - name: SOURCE_URL
          value: {{ .Values.source.url | default (printf "https://github.com/x24whoamix24/flappy-kernel/archive/refs/tags/v%s.tar.gz" .Chart.AppVersion) | quote }}
        {{- end }}
        {{- range $name, $value := .Values.env }}
        - {name: {{ $name }}, value: {{ $value | quote }}}
        {{- end }}
        {{- with .Values.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        resources: {{- toYaml .Values.resources | nindent 10 }}
        # Healthy once frames come from the GPU (startupTimeoutMinutes).
        startupProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 10
          failureThreshold: {{ mul .Values.startupTimeoutMinutes 6 }}
        livenessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 15
          failureThreshold: 4
        readinessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 5
        volumeMounts:
        - {name: model-cache, mountPath: /root/.cache/huggingface}
        - {name: shm, mountPath: /dev/shm}
      volumes:
      - name: model-cache
        {{- if .Values.modelCache.existingClaim }}
        persistentVolumeClaim: {claimName: {{ .Values.modelCache.existingClaim | quote }}}
        {{- else if .Values.modelCache.size }}
        persistentVolumeClaim: {claimName: {{ printf "%s-model-cache" .Release.Name | quote }}}
        {{- else if .Values.modelCache.hostPath }}
        hostPath: {path: {{ .Values.modelCache.hostPath | quote }}, type: DirectoryOrCreate}
        {{- else }}
        emptyDir: {}
        {{- end }}
      - name: shm
        emptyDir: {medium: Memory, sizeLimit: 16Gi}
