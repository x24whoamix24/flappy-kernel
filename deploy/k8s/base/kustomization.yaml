# Generic deployment. Set the image and, if you have one, a persistent Hugging Face
# cache (the base uses an emptyDir, so every restart downloads the model again).
#   kubectl apply -k deploy/k8s/base
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- deployment.yaml
- service.yaml
# Point at the image you built and pushed:
# images:
# - name: flappy-kernel
#   newName: registry.example.com/flappy-kernel
#   newTag: v0.2.0
