# SPDX-License-Identifier: Apache-2.0
# The arcade on one GPU: the Mirage megakernel process and the web server in one
# container (they share memory through /dev/shm). One replica per GPU.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flappy-kernel
  labels: {app.kubernetes.io/name: flappy-kernel}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: flappy-kernel}
  template:
    metadata:
      labels: {app.kubernetes.io/name: flappy-kernel}
    spec:
      # Needs an H100 with 132 SMs to itself. On a mixed cluster, pin it, e.g.:
      # nodeSelector: {nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3}
      containers:
      - name: arcade
        # Built from the repository's Dockerfile; push it to your registry and set
        # it here or with kustomize (see kustomization.yaml).
        image: flappy-kernel:latest
        imagePullPolicy: IfNotPresent
        ports:
        - {name: http, containerPort: 8080}
        env:
        - {name: MODEL, value: Qwen/Qwen3-8B}
        - {name: MAX_SEQ, value: "1024"}
        - {name: LLM_WORKERS, value: "96"}
        - {name: COTENANT_BLOCKS, value: "32"}
        resources:
          requests: {cpu: "16", memory: 64Gi, nvidia.com/gpu: "1"}
          limits: {memory: 96Gi, nvidia.com/gpu: "1"}
        # The server starts listening once the megakernel runs: model download
        # (first start only) plus compilation take up to ~15 minutes.
        startupProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 10
          failureThreshold: 120
        livenessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 15
          failureThreshold: 4
        readinessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 5
        volumeMounts:
        - {name: hf-cache, mountPath: /root/.cache/huggingface}
        - {name: shm, mountPath: /dev/shm}
      volumes:
      # Every restart downloads the model (~16 GB) again into this emptyDir. To keep
      # it, use a PersistentVolumeClaim instead:
      #   persistentVolumeClaim: {claimName: hf-cache}
      - name: hf-cache
        emptyDir: {}
      - name: shm
        emptyDir: {medium: Memory, sizeLimit: 16Gi}
